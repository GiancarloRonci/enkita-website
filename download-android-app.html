<!DOCTYPE html>
<html lang="en" data-title-key="play.title">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="3;url=https://play.google.com/store/apps/details?id=it.parloenglish.app" />
  <title>Redirecting to Google Play — Enkita</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">
      Enkita
      <span class="nav-logo-flags">
        <svg class="flag-icon" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
          <rect width="60" height="30" fill="#00247d" />
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
          <path d="M0,0 L24,12 M60,0 L36,12 M0,30 L24,18 M60,30 L36,18" stroke="#cf142b" stroke-width="4" />
          <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10" />
          <path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6" />
        </svg>
        <svg class="flag-icon" viewBox="0 0 30 20" xmlns="http://www.w3.org/2000/svg">
          <rect width="10" height="20" fill="#009246" />
          <rect x="10" width="10" height="20" fill="#fff" />
          <rect x="20" width="10" height="20" fill="#ce2b37" />
        </svg>
      </span>
    </a>
    <ul class="nav-links">
      <li class="nav-lang">
        <button class="lang-btn" data-lang="it" onclick="setLang('it')">🇮🇹</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧</button>
      </li>
    </ul>
  </nav>

  <section class="redirect">
    <div class="redirect-card">
      <span class="hero-badge" data-i18n="play.badge">Welcome</span>
      <div class="spinner" aria-hidden="true"></div>
      <h1 data-i18n="play.h1">Taking you to Google Play…</h1>
      <p data-i18n="play.p">Thanks for choosing Enkita! We're redirecting you to the Play Store to finish the installation.</p>
      <a href="https://play.google.com/store/apps/details?id=it.parloenglish.app" class="btn-primary" data-i18n="play.btn">Open Google Play now</a>
    </div>
  </section>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="mailto:info@enkita.app" data-i18n="footer.contact">Contact</a>
    </div>
    <p class="footer-copy">© 2026 Giancarlo Ronci — Enkita</p>
  </footer>

  <script>
    setTimeout(function () {
      window.location.href = "https://play.google.com/store/apps/details?id=it.parloenglish.app";
    }, 2500);
  </script>
  <script src="js/i18n.js"></script>
</body>
</html>
